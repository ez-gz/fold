[package]
name = "fold-solver"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "fold-cli"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
