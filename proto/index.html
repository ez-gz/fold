<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fold — backbone prototype</title>
<style>
:root{
  --bg:#0b0f14; --panel:#131a22; --panel2:#1a232e; --line:#263241; --text:#e8eef5; --dim:#8a99ab;
  --accent:#5ee6b0; --fold:#4f7fd1; --call:#3fbf86; --bet1:#f0a63a; --bet2:#ef5b5b; --bad:#ef5b5b; --warn:#f0a63a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overscroll-behavior:none}
#app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:4px 0 8px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
.overlay{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}.overlay>.sheet{width:min(560px,100%);max-height:86vh;overflow:auto;margin:0;border-radius:18px 18px 0 0}.overlay h3{display:flex;justify-content:space-between}.overlay .x{color:var(--dim);font-size:12px;cursor:pointer}
.cell.miss.soft{box-shadow:inset 0 0 0 1px var(--bad)}.cell.extra.soft{box-shadow:inset 0 0 0 1px var(--warn)}
.cell.sd::before{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;border:1px solid #fff;z-index:3}
.pzcount{font-size:12px;color:var(--dim);margin:0 0 8px}.pzcount b{color:var(--text,#fff);font-size:16px}
.pzg{display:flex;flex-wrap:wrap;gap:6px}
.pzc{border:1px solid #ffffff1f;border-radius:12px;background:#ffffff08;overflow:hidden;animation:pzin .28s both cubic-bezier(.2,.9,.3,1.2);transition:background .18s,border-color .18s,flex-basis .2s}
.pzc .hd{display:flex;gap:8px;align-items:baseline;padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}.pzc .hd b{font-size:15px}.pzc .n{font-size:11px;color:var(--dim)}
.pzc.on{background:#2fd39a22;border-color:var(--accent)}.pzc.part{border-style:dashed}.pzc.dead{opacity:.35}
.pzc{flex:0 0 calc(25% - 5px);box-sizing:border-box}.pzc .hd{justify-content:space-between;padding:10px 9px}
.pzc .cbs{display:none;gap:5px;padding:2px 10px 10px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.pzc.open{flex-basis:100%}.pzc.open .cbs{display:grid;animation:pzin .22s both ease-out}.pzc.open .hd{justify-content:flex-start}
.cb{display:flex;gap:3px;justify-content:center;padding:6px 4px;border-radius:9px;background:#ffffff0d;border:1px solid transparent;opacity:.45;cursor:pointer;transition:opacity .15s,transform .15s,background .25s,border-color .25s}
.cb.on{opacity:1;border-color:#ffffff40;transform:scale(1.03)}.cb.ok{background:#2fd39a33;border-color:var(--accent);opacity:1}.cb.miss{border-color:var(--bad);background:#ff5d5d22;opacity:1}.cb.extra{border-color:var(--warn);background:#ffb84d22;opacity:1}
.mc{font-weight:700;font-size:13px;background:#fff;color:#111;border-radius:5px;padding:2px 4px;min-width:26px;text-align:center}.mc.h,.mc.d{color:#d22}.mc.d{color:#1565c0}.mc.c{color:#1b7f3b}
@keyframes pzin{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
.cr{display:flex;align-items:center;gap:4px;padding:7px 8px;border-radius:10px;margin-bottom:5px;background:#ffffff0a;animation:pzin .2s both}.cr.me{outline:1.5px solid #fff}
.cr .cx{flex:1;margin-left:8px;min-width:0}.cr .t{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}.cr .t i{display:block;height:100%}.cr small{display:block;font-size:11px;margin-top:3px;color:var(--dim)}.cr em{font-style:normal;font-weight:600}
.cr.out{opacity:.35}.cr .why{margin-left:8px;font-size:11px;color:var(--dim)}
.chip.on{color:#06110c;background:var(--accent);border-color:var(--accent);font-weight:600}
.table{margin-top:10px;background:radial-gradient(120% 90% at 50% 0%,#17303a 0%,#10202a 55%,#0d161e 100%);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;position:relative;overflow:hidden}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.hist{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;align-items:flex-start;gap:4px}.hrow .st{padding-top:3px}.hrow.now .st{padding-top:9px}.pls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;flex:1}.hrow .arr{color:#56677b;font-size:11px}
.hrow .st{width:36px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#56677b}
.pl{border-radius:9px;background:#0c141b;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:12px;padding:6px 9px;white-space:nowrap}
.pl b{font-size:10px;margin-right:5px;opacity:.75}.pl.me b{color:var(--accent);opacity:1}
.pl.raise{background:#4a2a12;border-color:var(--bet1);color:#ffd9a0}.pl.call{background:#123c2c;border-color:var(--call);color:#b8f1d8}.pl.chk{color:var(--text)}
.pl.turn{border-style:dashed;color:var(--text)}
.hrow.past .pl{font-size:10.5px;padding:2px 7px;border-radius:6px;opacity:.8}.hrow.past .pl b{font-size:9px}
.seats.done .seat.folded{display:none}.seats.done .seat{padding:2px 0;font-size:10px;opacity:.8}.seats.done .seat small{display:inline;margin-left:4px}.seats.done{margin-top:14px}.seats + .hist .hrow:first-child .pl.me::before{display:none}.seats + .hist .hrow:first-child{margin-top:0}.hist .hrow:first-child .pl.me{position:relative}.hist .hrow:first-child{margin-top:6px}.hist .hrow:first-child .pl.me::before{content:"YOU";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;background:var(--accent);color:#06110c;border-radius:4px;padding:0 4px;letter-spacing:.06em;line-height:11px}
.board{display:flex;justify-content:center;gap:6px;margin:14px 0 8px}
.card{width:50px;height:70px;border-radius:9px;background:#f6f7f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;line-height:1;box-shadow:0 6px 14px #0008;animation:deal .28s cubic-bezier(.2,.9,.3,1.2) backwards}
.card small{font-size:20px;margin-top:2px}
.card.s{color:#1b1f26}.card.h{color:#d8323c}.card.d{color:#2367d8}.card.c{color:#1e9a52}
.card.new{outline:2px solid var(--accent);outline-offset:1px}
@keyframes deal{from{transform:translateY(-16px) scale(.9);opacity:0}}
.pot{text-align:center;font-size:13px;color:var(--dim)}
.behind{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.pot b{color:var(--text);font-size:16px}
.hero{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.hero .card{width:58px;height:80px;font-size:28px}
.hero .who{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;text-align:left}

.actions{display:grid;gap:8px;margin-top:12px}
.act{position:relative;border:0;border-radius:16px;padding:0 16px;height:58px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;overflow:hidden;transition:transform .08s}
.act:active{transform:scale(.97)}
.act .sub{font-size:12px;font-weight:500;opacity:.9;text-align:right;font-variant-numeric:tabular-nums}
.act .fill{position:absolute;left:0;top:0;bottom:0;background:#fff3;width:0;transition:width .45s ease}
.act>*:not(.fill){position:relative}
.act.done{cursor:default;opacity:.55}.act.done.best{opacity:1;box-shadow:0 0 0 2px var(--accent)}.act.done.picked{opacity:1}
.act.done.picked::after{content:"YOU";position:absolute;right:8px;top:4px;font-size:9px;letter-spacing:.1em;opacity:.8}
.k-fold{background:var(--fold)}.k-check,.k-call{background:var(--call)}.k-bet0,.k-raise0{background:var(--bet1)}.k-bet1,.k-raise1{background:var(--bet2)}
.verdict{margin-top:12px;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:pop .3s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.verdict .g{font-size:20px;font-weight:800}.verdict .l{font-size:12px;opacity:.85;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.g-Best{background:#123c2c;color:var(--accent)}.g-Good{background:#16342b;color:#9be3c5}.g-Inaccuracy{background:#3d3215;color:var(--warn)}.g-Mistake{background:#432418;color:#ff9a6b}.g-Blunder{background:#451a1e;color:var(--bad)}
.sheet{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;animation:up .3s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.sheet h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600}
.why p{margin:0 0 9px}.why p:last-child{margin:0}.why b{color:#fff}.why .k{color:var(--accent);font-weight:600}
.seg{display:flex;background:#0c1218;border-radius:11px;padding:3px;gap:3px;margin-bottom:9px}
.seg div{flex:1;text-align:center;padding:7px 4px;border-radius:9px;font-size:12px;color:var(--dim);cursor:pointer;font-weight:600}
.seg div.on{background:var(--panel2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1.5px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;border-radius:3px;background:#0e151c;font-size:8.5px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#ffffff59;position:relative;overflow:hidden}
.cell i{position:absolute;inset:0;font-style:normal}.cell span{position:relative}
.cell.in{color:#fff}.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);color:#fff;background:#1d4a3b}
.cell.me{overflow:visible;z-index:2;color:#fff}.cell.me::after{content:"";position:absolute;inset:-2px;border:2px solid #fff;border-radius:4px;box-shadow:0 0 0 1px #000,0 0 8px #fff8}
.more summary{color:var(--dim);font-size:12px;cursor:pointer;margin-top:6px}
.cell.miss{box-shadow:inset 0 0 0 2px var(--bad)}.cell.extra{box-shadow:inset 0 0 0 2px var(--warn)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bars{margin-top:10px;display:grid;gap:5px}
.bar{display:grid;grid-template-columns:118px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.bar .t{height:9px;border-radius:5px;background:#0c1218;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar b{color:var(--text);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:#0c1218;border-radius:12px;padding:8px 10px}.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.kpi span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.next{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:12px;width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:#06110c;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px #000a}
.ghost{background:var(--panel2);color:var(--text);box-shadow:none;position:static}
.seats{display:flex;gap:4px;justify-content:space-between;margin-top:10px}
.seat{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:6px 0 4px;border-radius:9px;background:#0c141b;border:1px solid var(--line);color:var(--dim);transition:all .2s;position:relative}
.seat small{display:block;font-weight:500;font-size:9.5px;min-height:12px;opacity:.9}
.seat em{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-style:normal;font-size:8px;background:var(--accent);color:#06110c;border-radius:4px;padding:0 4px;letter-spacing:.06em}
.seat.act-now{border-color:#fff;color:#fff;transform:translateY(-2px)}
.seat.folded{opacity:.28}.seat.raise{background:#4a2a12;border-color:var(--bet1);color:#ffd9a0}.seat.call{background:#123c2c;border-color:var(--call);color:#b8f1d8}
.toast{text-align:center;font-size:13px;margin-top:8px;color:#cfe;min-height:18px;animation:up .3s ease}
.score{text-align:center;padding:18px 10px}.score .big{font-size:54px;font-weight:800;line-height:1;color:var(--accent)}.score .big small{font-size:20px;color:var(--dim)}
.rows{display:grid;gap:6px;margin-top:12px}.row{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;background:#0c1218;border-radius:12px;padding:9px 11px;font-size:13px;cursor:pointer}
.row.on{background:#ffffff0d;box-shadow:inset 2px 0 0 var(--accent)}.row{cursor:pointer}.row .pts{font-weight:800;font-variant-numeric:tabular-nums}.row small{color:var(--dim);display:block;font-size:11px}
.vrow{display:grid;grid-template-columns:104px 1fr 46px;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin-top:7px}
.vrow .tr{display:grid;gap:2px}.vrow .ln{height:8px;position:relative;background:#0c1218;border-radius:4px}
.vrow .ln i{position:absolute;top:0;bottom:0;border-radius:4px}.vrow .ln::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3a4b5f}
.vrow b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prompt{font-size:14px;margin:0 0 8px}.prompt b{color:var(--accent)}
.foot{margin-top:14px;font-size:10.5px;color:#56677b;text-align:center;line-height:1.5}
.empty{padding:40px 10px;text-align:center;color:var(--dim)}
</style>

<body>
<div id="app">
  <header>
    <div class="logo">FOLD</div>
    <div class="chips" id="filters"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div id="main"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
"use strict";
const R = "AKQJT98765432", SUIT = {s:"♠",h:"♥",d:"♦",c:"♣"}, STREETS = ["Flop","Turn","River"];
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const pct = (x, d = 0) => (100 * x).toFixed(d) + "%";
const store = { get(k, d){ try { const v = localStorage.getItem("fold."+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem("fold."+k, JSON.stringify(v)); } catch(e){} } };

let PACK = window.FOLD_PACK;
const SEATS = ["UTG","HJ","CO","BTN","SB","BB"], sleep = ms => new Promise(r => setTimeout(r, ms));
const state = { mode: store.get("mode", "hands"), hand: null, hn: 0, hsum: 0, street: store.get("street", -1), rangeCheck: store.get("rangeCheck", false), focus: null, queue: [], cur: null, n: 0, loss: 0, best: 0, streak: 0 };

function cellName(i){ const r = Math.floor(i/13), c = i%13; return r === c ? R[r]+R[c] : r < c ? R[r]+R[c]+"s" : R[c]+R[r]+"o"; }
function cellOf(hand){ // hand = ["Ah","Kd"]
  const a = R.indexOf(hand[0][0]), b = R.indexOf(hand[1][0]), hi = Math.min(a,b), lo = Math.max(a,b);
  return hi === lo || hand[0][1] === hand[1][1] ? hi*13+lo : lo*13+hi;
}
function cardEl(c, cls = ""){ return `<div class="card ${c[1]} ${cls}">${c[0] === "T" ? "10" : c[0]}<small>${SUIT[c[1]]}</small></div>`; }
function kindClass(spot, i){ const a = spot.actions[i]; if (a.kind === "bet" || a.kind === "raise"){ const bets = spot.actions.filter(x => x.kind === a.kind); return `k-${a.kind}${bets.length > 1 ? bets.indexOf(a) : 0}`; } return "k-" + a.kind; }
function kindColor(kind, idx = 0){ return kind === "fold" ? "var(--fold)" : kind === "check" || kind === "call" ? "var(--call)" : idx ? "var(--bet2)" : "var(--bet1)"; }

/* ---------- labels: big blinds first, pot % in parens ---------- */
const bbf = x => (Math.round(x * 10) / 10).toString() + "bb";
function relabelHistory(f, hist){
  let pot = f.start_pot, owe = 0, commit = {}, st = 0;
  return hist.map(h => {
    h = { ...h }; let m;
    if (h.street !== st){ st = h.street; commit = {}; owe = 0; }
    if ((m = h.label.match(/^Bet (\d+)%/))){ const amt = pot * m[1] / 100; h.label = `Bet ${bbf(amt)} (${m[1]}%)`; commit[h.pos] = amt; owe = amt; pot += amt; }
    else if (h.label === "Call"){ h.label = `Call ${bbf(owe)}`; pot += owe; owe = 0; }
    else if ((m = h.label.match(/^Raise to ([\d.]+)/))){ const to = +m[1], prev = Math.max(0, ...Object.values(commit)); pot += to - (commit[h.pos] || 0); owe = to - prev; commit[h.pos] = to; h.label = `Raise to ${bbf(to)}`; }
    return h;
  });
}
function relabel(f, s){
  if (s._raw) return; s._raw = { history: s.history, actions: s.actions.map(a => a.label) };
  s.history = relabelHistory(f, s.history);
  const fix = (label, amt) => { let m; return (m = label.match(/^Bet (\d+)%/)) ? `Bet ${bbf(amt != null ? amt : s.pot * m[1] / 100)} (${m[1]}%)` : (m = label.match(/^Raise to ([\d.]+)/)) ? `Raise to ${bbf(+m[1])}` : label; };
  s.actions.forEach(a => a.label = a.kind === "call" ? `Call ${bbf(s.to_call)}` : fix(a.label, a.kind === "bet" ? a.amt : null));
  s.resp.forEach((r, i) => { if (r) r.labels = r.labels.map((l, k) => r.kinds[k] === "call" ? `Call ${bbf(s.actions[i].amt - s.to_call)}` : fix(l, null)); });
}
const verb = x => `${x.pos} ${x.label.toLowerCase().replace(/^(check|bet|call|raise|fold)/, "$1s")}`;

function formInfo(f){
  const P = (PACK.formations || {})[f.formation]; if (P) return P;
  const m = f.formation.match(/^(\w+) vs (\w+)/); return { opener: f.opener || m[1], caller: f.caller || m[2], open_size: f.open_size || 2.5, pos: f.pos || [m[2], m[1]], pre: null };
}

/* ---------- queue ---------- */
function buildQueue(){
  const q = [];
  for (const f of PACK.flops) for (const s of f.spots) { if (state.street >= 0 && s.street !== state.street) continue; if (state.focus && !focusSet().has(concept(f, s))) continue; for (const d of s.drills) q.push({ f, s, d }); }
  for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [q[i], q[j]] = [q[j], q[i]]; }
  state.queue = q;
}
function next(){ if (!state.queue.length) buildQueue(); state.cur = state.queue.pop(); state.cur ? renderSpot() : (main.innerHTML = `<div class="empty">No spots for this filter.</div>`); window.scrollTo(0,0); }

/* ---------- grading ---------- */
/* ---------- concepts: name the situation so results can be tracked and drilled by it ---------- */
function concept(f, s){
  const F = formInfo(f), agg = s.hero === F.opener, H = (s._raw ? s._raw.history : s.history);
  const lab = h => (typeof h.label === "string" ? h.label : ""), isBet = h => /bet|raise|all/i.test(lab(h)) && !/call/i.test(lab(h));
  const cur = H.filter(h => h.street === s.street), prev = H.filter(h => h.street === s.street - 1);
  const iBet = l => l.some(h => h.pos === s.hero && isBet(h)), anyBet = l => l.some(isBet);
  if (s.to_call > 0){
    if (iBet(cur)) return s.street === 0 ? "Facing a flop raise" : "Facing a turn or river raise";
    if (s.street === 2) return "Facing a river bet";
    if (s.street === 1) return "Facing a turn bet";
    return agg ? "Facing a flop lead" : "Facing a c-bet";
  }
  if (s.street === 0) return agg ? "C-bet or check" : cur.length ? "Stab when checked to" : "Lead or check";
  // who made the last bet or raise on the previous street decides who has the betting lead now
  const last = [...prev].reverse().find(isBet), lead = last ? last.pos === s.hero : null;
  if (lead === null) return agg ? (s.street === 1 ? "Delayed c-bet" : "River bet after checks") : (s.street === 1 ? "Turn probe" : "River probe");
  if (lead) return agg ? (s.street === 1 ? "Second barrel" : iBet(H.filter(h => h.street === 0)) ? "Third barrel" : "River bet after betting turn") : "Keep betting after taking the lead";
  return cur.length ? "Bet when checked to" : (agg ? "After calling a bet or raise" : "Check or lead after calling");
}
const STREET_NAMES = ["Flop", "Turn", "River"];
function track(f, s, d, gr){
  const book = store.get("book", {}), keys = ["c:" + concept(f, s), "s:" + STREET_NAMES[s.street], "h:" + f.class_names[d.cls], "p:" + (s.hero === formInfo(f).opener ? "As the aggressor" : "As the caller")];
  keys.forEach(k => { const e = book[k] || (book[k] = { n: 0, p: 0, bb: 0, ok: 0 }); e.n++; e.p += Math.min(gr.p, 25); e.bb += gr.loss; if (gr.g === "Best" || gr.g === "Good") e.ok++; });
  store.set("book", book);
}
function grade(spot, d, i){
  const best = Math.max(...d.ev), loss = Math.max(0, best - d.ev[i]), p = 100*loss/spot.pot;
  let g = p <= 0.3 ? "Best" : p <= 1.5 ? "Good" : p <= 5 ? "Inaccuracy" : p <= 12 ? "Mistake" : "Blunder";
  if (d.strat[i] >= 0.25 && (g === "Inaccuracy")) g = "Good"; // solver noise guard on genuinely mixed spots
  return { g, loss, p, bestIdx: d.ev.indexOf(best) };
}

/* ---------- rationale (templated from solver facts) ---------- */
function topClasses(f, shares, n = 2, min = 0.03){
  const tot = shares.reduce((a,b) => a+b, 0) || 1;
  return shares.map((v,i) => [v/tot, i]).filter(x => x[0] >= min).sort((a,b) => b[0]-a[0]).slice(0,n).map(x => `${f.class_names[x[1]].toLowerCase()} (${pct(x[0])})`).join(", ");
}
function groupSummary(sh){ const t = sh.reduce((a,b)=>a+b,0)||1; return { strong:(sh[0]+sh[1])/t, mid:sh[2]/t, draws:(sh[3]+sh[4])/t, air:(sh[5]+sh[6])/t }; }
function exampleCells(spot, grid, n = 4){ // chart cells carrying the most of villain's range into this response
  const combos = i => (i%14 === 0 ? 6 : Math.floor(i/13) < i%13 ? 4 : 12);
  return grid.map((v, i) => [v * spot.vr[i] * combos(i), i]).filter(x => x[0] > 0.3).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => cellName(x[1])).join(", ");
}
function respInfo(f, spot, d, a){
  const r = spot.resp[a]; if (!r) return null;
  const fi = r.kinds.indexOf("fold"), fold = fi >= 0 ? r.freq[fi] : 0;
  const cont = Array(7).fill(0); let raise = 0;
  r.kinds.forEach((k, x) => { if (k !== "fold") r.cls[x].forEach((v, c) => cont[c] += v); if (k === "raise" || k === "bet") raise += r.freq[x]; });
  const contGrid = Array(169).fill(0); r.kinds.forEach((k, x) => { if (k !== "fold") r.grid[x].forEach((v, c) => contGrid[c] += v); });
  return { r, fold, raise, cont, foldCls: fi >= 0 ? r.cls[fi] : null, eq: d.eq_cont[a], foldEx: fi >= 0 ? exampleCells(spot, r.grid[fi]) : "", contEx: exampleCells(spot, contGrid) };
}
function explain(f, spot, d, chosen, gr){
  const V = spot.villain, A = spot.actions, out = [], g = groupSummary(spot.vclass), best = gr.bestIdx;
  const rank = d.top == null ? "" : ` — ${d.top <= 0.5 ? "top " + Math.max(1, Math.round(100*d.top)) : "bottom " + Math.max(1, Math.round(100*(1-d.top)))}% of your range`;
  if (gr.g !== "Best" && gr.g !== "Good") out.push(`<b>${A[chosen].label}</b> gives up ${gr.loss.toFixed(2)}bb vs <b>${A[best].label}</b>.`);
  else if (d.strat.filter(v => v > 0.15).length > 1) out.push(`Mixed spot — the solver's options are near-equal in EV.`);
  out.push(`<span class="k">${V}:</span> ${pct(g.strong)} top pair+, ${pct(g.mid)} weak pairs, ${pct(g.draws)} draws, ${pct(g.air)} air. <span class="k">You:</span> ${f.class_names[d.cls].toLowerCase()}, <b>${pct(d.eq)}</b> equity${rank}.`);
  const line = i => {
    const a = A[i], x = respInfo(f, spot, d, i);
    if ((a.kind === "bet" || a.kind === "raise") && x){
      let t = `<span class="k">${a.label}:</span> folds <b>${pct(x.fold)}</b>${x.foldEx ? ` (${x.foldEx})` : ""}, continues with ${x.contEx || topClasses(f, x.cont, 2)} — you have <b>${pct(x.eq)}</b> vs that.`;
      const ci = A.findIndex(o => o.kind === "check");
      if (d.eq < 0.4 && ci >= 0 && d.ev[ci] > d.ev[i] + 0.02 && d.eq >= 0.12) t += ` The folds are hands you already beat; checking wins ${pct(d.eq)} for free.`;
      else if (x.eq < 0.45 && d.eq >= 0.5) t += ` Only better hands pay you.`;
      else if (x.eq >= 0.55) t += ` Worse hands keep paying.`;
      return t;
    }
    if (a.kind === "call" || a.kind === "fold"){ const need = spot.to_call / (spot.pot + spot.to_call); return `<span class="k">Price:</span> need <b>${pct(need)}</b>, you have <b>${pct(d.eq)}</b>${d.eq < need ? " — not enough" : d.eq < need + 0.08 ? " — close; playability decides" : " — enough"}.`; }
    if (a.kind === "check" && x && x.r.kinds.includes("bet")) return `<span class="k">Check:</span> ${V} bets <b>${pct(x.raise)}</b> behind you; you keep ${pct(d.eq)} equity at no cost.`;
    return "";
  };
  [...new Set([best, chosen])].forEach(i => { const t = line(i); if (t) out.push(t); });
  const vt = valueText(f, spot, d, chosen, gr); if (vt) out.push(vt.split(/\. (?=Against)/)[0] + ".");
  return out.map(s => `<p>${s}</p>`).join("") + `<details class="more"><summary>Full breakdown</summary>${explainFull(f, spot, d, chosen, gr)}</details>`;
}
function explainFull(f, spot, d, chosen, gr){
  const V = spot.villain, out = [], A = spot.actions, cn = f.class_names[d.cls].toLowerCase();
  const g = groupSummary(spot.vclass);
  out.push(`<span class="k">${V}'s range right now:</span> ${pct(g.strong)} top pair or better, ${pct(g.mid)} weaker pairs, ${pct(g.draws)} draws, ${pct(g.air)} ace-high / air.`);
  out.push(`<span class="k">Your hand:</span> ${cn} with <b>${pct(d.eq)}</b> equity against that range.`);
  if (spot.to_call > 0){
    const need = spot.to_call / (spot.pot + spot.to_call);
    out.push(`<span class="k">The price:</span> calling ${bbf(spot.to_call)} into ${bbf(spot.pot)} needs <b>${pct(need)}</b> equity. You have ${pct(d.eq)} against the range that bets here${d.eq < need ? " — not enough on its own" : d.eq < need + 0.08 ? " — close, so how well the hand plays later streets decides it" : " — comfortably enough"}.`);
  }
  const infos = A.map((_, a) => respInfo(f, spot, d, a));
  A.forEach((a, i) => {
    const x = infos[i]; if (!x) return;
    if (a.kind === "bet" || a.kind === "raise"){
      const need = a.amt / (spot.pot + a.amt);
      let s = `<span class="k">${a.label}:</span> ${V} folds <b>${pct(x.fold)}</b>${x.foldCls ? ` — mostly ${topClasses(f, x.foldCls)}` : ""}${x.foldEx ? ` (hands like <b>${x.foldEx}</b>)` : ""}. They continue with ${topClasses(f, x.cont, 3)}${x.contEx ? ` (e.g. <b>${x.contEx}</b>)` : ""}`;
      s += `, and you have <b>${pct(x.eq)}</b> against that continuing range.`;
      if (d.eq < 0.4){
        s += ` As a bluff this needs ${pct(need)} folds to show a profit; it gets ${pct(x.fold)}.`;
        const ci = A.findIndex(o => o.kind === "check");
        if (ci >= 0 && d.ev[ci] > d.ev[i] + 0.02 && d.eq >= 0.12) s += ` <b>But the bar is not zero — it is the EV of checking (${d.ev[ci].toFixed(2)}bb vs ${d.ev[i].toFixed(2)}bb for this bet).</b> Your hand wins ${pct(d.eq)} of the time when it checks, and the hands this bet folds out are mostly hands you already beat. A good bluff is a hand that wins almost nothing by checking.`;
      }
      if (x.raise > 0.08) s += ` Expect a raise ${pct(x.raise)} of the time.`;
      out.push(s);
    } else if (a.kind === "check" && x.r.kinds.includes("bet")){
      out.push(`<span class="k">Check:</span> ${V} bets <b>${pct(x.raise)}</b> of the time behind you, mostly with ${topClasses(f, x.r.cls[x.r.kinds.indexOf("bet")], 3)}.`);
    }
  });
  const bets = A.map((a, i) => ({ a, i, x: infos[i] })).filter(o => o.a.kind === "bet" && o.x);
  if (bets.length >= 2){
    const s = bets[0], b = bets[bets.length-1];
    const extra = b.x.foldCls.map((v, c) => v - s.x.foldCls[c]);
    let t = `<span class="k">Small vs big:</span> going ${b.a.label.toLowerCase()} instead of ${s.a.label.toLowerCase()} folds out an extra <b>${pct(b.x.fold - s.x.fold)}</b> of ${V}'s range — mainly ${topClasses(f, extra.map(v => Math.max(0, v)))}. Your equity against what continues goes from ${pct(s.x.eq)} to ${pct(b.x.eq)}. `;
    if (s.x.eq >= 0.5 && b.x.eq < 0.5) t += `The small size keeps worse hands in the pot; the big size mostly gets called by hands that beat you. That is the signature of a <b>thin value / protection bet: go small</b>.`;
    else if (b.x.eq >= 0.55) t += `You are still ahead of even the tighter range that calls the big bet, so the hands you keep in are paying you: <b>bigger builds the pot you expect to win</b>.`;
    else if (d.eq < 0.4) t += `With little showdown value, what matters is folds per chip risked, plus how your hand does when called.`;
    else t += `Neither size gets called by enough worse hands to be clearly for value — this hand mostly wants to reach showdown cheaply.`;
    out.push(t);
  }
  const vt = valueText(f, spot, d, chosen, gr); if (vt) out.push(vt);
  const plan = spot.hclass_strat[d.cls].map((v, i) => [v, i]).filter(x => x[0] >= 0.05).sort((a,b) => b[0]-a[0]).map(x => `${A[x[1]].label.toLowerCase()} ${pct(x[0])}`).join(", ");
  out.push(`<span class="k">Your whole range:</span> the solver plays ${cn} here as ${plan}. With this exact hand: ${A.map((a,i) => `${a.label.toLowerCase()} ${pct(d.strat[i])}`).join(", ")}.`);
  if (gr.g !== "Best" && gr.g !== "Good") out.unshift(`<b>${A[chosen].label}</b> gives up ${gr.loss.toFixed(2)}bb against <b>${A[gr.bestIdx].label}</b>.`);
  else if (chosen !== gr.bestIdx || d.strat.filter(v => v > 0.15).length > 1) out.unshift(`This is a mixed spot — the options the solver uses are within ${Math.max(...d.ev.filter((_, i) => d.strat[i] > 0.15).map(e => Math.max(...d.ev) - e)).toFixed(2)}bb of each other.`);
  return out.map(s => `<p>${s}</p>`).join("");
}

/* ---------- grids ---------- */
function gridEl(paint){ const g = $(`<div class="grid"></div>`); for (let i = 0; i < 169; i++) g.appendChild($(`<div class="cell" data-i="${i}"><i></i><span>${cellName(i)}</span></div>`)); if (paint) paint(g); return g; }
function paintSplit(g, weight, parts, me){ // parts: [{color, grid}]
  [...g.children].forEach((c, i) => {
    const w = weight[i]; c.className = "cell" + (w > 0.02 ? " in" : "") + (i === me ? " me" : "");
    let acc = 0; const stops = [];
    if (w > 0.02) parts.forEach(p => { const v = p.grid[i] * 100; if (v > 0.5){ stops.push(`${p.color} ${acc}% ${acc+v}%`); acc += v; } });
    c.firstChild.style.cssText = stops.length ? `background:linear-gradient(90deg,${stops.join(",")});opacity:${0.25 + 0.75*Math.min(1,w)}` : "";
  });
}

/* ---------- screens ---------- */
const main = document.getElementById("main");
function renderSpot(){
  relabel(state.cur.f, state.cur.s);
  const { f, s, d } = state.cur, newCard = s.board.length > 3 ? s.board.length - 1 : -1;
  const F = formInfo(f);
  const pill = (pos, txt, kind) => `<span class="pl ${kind} ${pos === s.hero ? "me" : ""}"><b>${pos}</b>${txt}</span>`;
  const hk = h => h.kind || (/call/i.test(h.label) ? "call" : /bet|raise|all/i.test(h.label) ? "raise" : /fold/i.test(h.label) ? "folded" : "chk");
  const tb = F.three_bet || f.three_bet || 0;
  const rows = [[-1, tb ? [pill(F.caller, bbf(F.open_size), "raise"), pill(F.opener, "3-bet " + bbf(tb), "raise"), pill(F.caller, "call", "call")] : [pill(F.opener, bbf(F.open_size), "raise"), pill(F.caller, "call", "call")]]];
  s.history.forEach(h => { if (rows[rows.length-1][0] !== h.street) rows.push([h.street, []]); rows[rows.length-1][1].push(pill(h.pos, h.label.replace(/^(Bet|Raise to|Call|Check)\b/, m => m.toLowerCase()), hk(h))); });
  if (rows[rows.length-1][0] !== s.street) rows.push([s.street, []]);
  rows[rows.length-1][1].push(`<span class="pl turn me"><b>${s.hero}</b>to act</span>`);
  const animating = state.hand && state.hand.k === 0 && !state.hand.res.length;
  const hist = rows.map(([st, ps], k) => (k === 0 && animating) ? "" : `<div class="hrow ${k === rows.length-1 ? "now" : "past"}"><span class="st">${st < 0 ? "Pre" : STREETS[st]}</span><div class="pls">${ps.join('<span class="arr">›</span>')}</div></div>`).join("");
  main.innerHTML = "";
  main.appendChild($(`<div class="table">
    ${animating ? `<div class="seats">${SEATS.map(p => `<div class="seat ${p === f.opener ? "raise" : p === f.caller ? "call" : "folded"}" data-p="${p}">${p === s.hero ? "<em>YOU</em>" : ""}${p}<small>${p === f.opener ? (tb ? "3-bet " + tb : f.open_size) + "bb" : p === f.caller ? (tb ? f.open_size + " › call" : "call") : "fold"}</small></div>`).join("")}</div>` : ""}
    <div class="hist">${hist}</div>
    <div class="board">${s.board.map((c, i) => cardEl(c, i === newCard ? "new" : "")).join("")}</div>
    <div class="pot">Pot <b>${bbf(s.pot)}</b>${s.to_call > 0 ? ` · <b>${bbf(s.to_call)}</b> to call` : ""}</div>
    <div class="behind">${bbf(s.stack)} behind</div>
    <div class="hero"><div class="who">You<b>${s.hero}</b></div>${d.hand.map((c, i) => cardEl(c).replace('class="card', `style="animation-delay:${.08*(i+1)}s" class="card`)).join("")}<div class="who" style="visibility:hidden">You<b>${s.hero}</b></div></div>
  </div>`));
  if (state.hand) return;
  state.rangeCheck ? renderRangeCheck() : renderActions();
}

function renderActions(){
  const { s } = state.cur;
  const box = $(`<div class="actions" id="actions"></div>`);
  s.actions.forEach((a, i) => {
    const b = $(`<button class="act ${kindClass(s, i)}"><div class="fill"></div><span>${a.label}</span><span class="sub"></span></button>`);
    b.onclick = () => answer(i); box.appendChild(b);
  });
  main.appendChild(box);
}

function renderRangeCheck(){
  const { s } = state.cur, sel = new Set(), base = new Set(), added = new Set(), removed = new Set();
  const setCell = (i, on) => { if (on){ added.add(i); removed.delete(i); sel.add(i); } else { removed.add(i); added.delete(i); sel.delete(i); } };
  const F = formInfo(state.cur.f), pre = F.pre ? F.pre[F.pos.indexOf(s.villain)] : null;
  const loadPre = () => { base.clear(); added.clear(); removed.clear(); if (pre) pre.forEach((w, i) => { if (w >= 0.3) base.add(i); }); };
  const recompute = () => { sel.clear(); base.forEach(i => sel.add(i)); added.forEach(i => sel.add(i)); removed.forEach(i => sel.delete(i)); };
  const sheet = $(`<div class="sheet"><p class="prompt">${pre ? `This is <b>${s.villain}</b>'s preflop range (${s.villain === F.opener ? "raised " + bbf(F.open_size) : "called " + F.opener + "'s raise"}). Narrow it to what they still have after the action so far.` : `Before you act: paint the hands <b>${s.villain}</b> can have here.`}</p><div class="chips" id="presets" style="margin-bottom:9px"></div></div>`);
  // board-aware one-tap groups (chart cells are rank-only, so suits/draws stay manual)
  const rc = i => [Math.floor(i/13), i%13], br = [...new Set(s.board.map(c => R.indexOf(c[0])))].sort((x, y) => x - y), top = br[0];
  const presets = {};
  br.forEach((b, k) => presets[`${R[b]}x${k === 0 ? " top pair" : ""}`] = i => { const [r, c] = rc(i); return r !== c && (r === b || c === b); });
  Object.assign(presets, {
    "Two pair": i => { const [r, c] = rc(i); return r !== c && br.includes(r) && br.includes(c); },
    "Sets": i => { const [r, c] = rc(i); return r === c && br.includes(r); },
    "Overpairs": i => { const [r, c] = rc(i); return r === c && r < top; },
    "Underpairs": i => { const [r, c] = rc(i); return r === c && r > top && !br.includes(r); },
    "Overcards": i => { const [r, c] = rc(i); return r !== c && r < top && c < top; },
    "Suited Ax": i => i < 13 && i > 0, "Offsuit Ax": i => i%13 === 0 && i > 0,
    "Suited conn.": i => { const [r, c] = rc(i); return c - r === 1 || c - r === 2; },
    "Clear": null });
  if (pre) presets["Preflop range"] = "pre";
  const g = gridEl();
  const sync = () => [...g.children].forEach((c, i) => c.classList.toggle("sel", sel.has(i)));
  for (const [name, fn] of Object.entries(presets)){
    const c = $(`<div class="chip">${name}</div>`);
    c.onclick = () => { if (fn === "pre"){ loadPre(); recompute(); slider.value = 100; slab.textContent = "Top 100% of their preflop range"; } else if (!fn){ base.clear(); added.clear(); removed.clear(); sel.clear(); slider.value = 0; slab.textContent = "Top 0%"; } else { const ids = [...Array(169).keys()].filter(i => fn(i) && (!pre || pre[i] >= 0.3 || sel.has(i))), all = ids.every(i => sel.has(i)); ids.forEach(i => setCell(i, !all)); } sync(); };
    sheet.querySelector("#presets").appendChild(c);
  }
  let mode = null;
  const hit = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest(".cell"); if (!c || !g.contains(c)) return; const i = +c.dataset.i; if (mode === null) mode = !sel.has(i); setCell(i, mode); c.classList.toggle("sel", mode); };
  g.addEventListener("pointerdown", e => { mode = null; hit(e); g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") mode !== null && hit(e); });
  g.addEventListener("pointerup", () => mode = null);
  // strength slider: top X% of all starting hands (Chen-formula order, combo-weighted); manual edits persist while sliding
  const chen = i => { const [r, c] = rc(i), hi = Math.min(r, c), lo = Math.max(r, c), pt = k => [10, 8, 7, 6][k] ?? (14 - k) / 2, gap = lo - hi - 1;
    if (r === c) return Math.max(5, pt(hi) * 2) + 0.01 * (13 - hi);
    return pt(hi) + (r < c ? 2 : 0) - ([0, 1, 2, 4][gap] ?? 5) + (gap <= 1 && hi > 2 ? 1 : 0) + 0.01 * (13 - hi) + 0.001 * (13 - lo); };
  const order = [...Array(169).keys()].filter(i => !pre || pre[i] >= 0.3).sort((x, y) => chen(y) - chen(x)), nc = i => (i%14 === 0 ? 6 : Math.floor(i/13) < i%13 ? 4 : 12);
  const wrap = $(`<div style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:2px"><span id="slab">${pre ? "Top 100% of their preflop range" : "Top 0% of hands"}</span><span>slide, then fix up by hand</span></div><input id="sl" type="range" min="0" max="100" value="${pre ? 100 : 0}" step="1" style="width:100%;accent-color:var(--accent);height:30px"></div>`);
  const slider = wrap.querySelector("#sl"), slab = wrap.querySelector("#slab");
  slider.oninput = () => { const wt = i => nc(i) * (pre ? pre[i] : 1), target = order.reduce((a, i) => a + wt(i), 0) * slider.value / 100; let acc = 0; base.clear(); for (const i of order){ if (acc >= target - 1e-9) break; base.add(i); acc += wt(i); } slab.textContent = `Top ${slider.value}% of ${pre ? "their preflop range" : "hands"}`; recompute(); sync(); };
  sheet.appendChild(wrap);
  loadPre(); recompute();
  sheet.appendChild(g); sync();
  const done = $(`<button class="next" style="position:static">Lock in range</button>`);
  done.onclick = () => {
    let hitW = 0, miss = 0, extra = 0;
    // cell weights relative to the fullest cell: after a line villain takes 30% of the time every cell is <= 0.3,
    // and what matters is which hands are in the range, not how often the line happens
    const vmax = Math.max(...s.vr, 1e-9), T = s.vr.map(t => Math.min(1, t / vmax));
    const combos = i => (i%14 === 0 ? 6 : Math.floor(i/13) < i%13 ? 4 : 12);
    T.forEach((t, i) => { const n = combos(i), on = sel.has(i); hitW += on ? t*n : 0; miss += on ? 0 : t*n; extra += on ? (1-t)*n : 0; });
    // Painting is all-or-nothing, so the truth is too: a cell is in the range if villain gets here with it at least
    // 30% as often as with their fullest cell, out if under 12%, and in between either answer is accepted.
    const IN = 0.3, OUT = 0.12; hitW = miss = extra = 0;
    T.forEach((t, i) => { if (t >= OUT && t < IN) return; const n = combos(i), on = sel.has(i), tin = t >= IN; if (tin && on) hitW += n; else if (tin) miss += n; else if (on) extra += n; });
    const score = 2*hitW / (2*hitW + miss + extra || 1);
    [...g.children].forEach((c, i) => { const t = T[i], on = sel.has(i); c.className = "cell" + (t > 0.02 ? " in" : "") + (t >= IN && !on ? " miss" : t < OUT && on ? " extra" : ""); c.firstChild.style.cssText = t > 0.02 ? `background:var(--call);opacity:${0.2+0.8*t}` : ""; });
    sheet.querySelector(".prompt").innerHTML = `Range read: <b>${pct(score)}</b> overlap. <span style="color:var(--bad)">Red</span> = hands you missed, <span style="color:var(--warn)">amber</span> = hands they don't have. ${suitNote(s)} Now act.`;
    sheet.querySelector("#presets").remove(); wrap.remove(); done.remove(); g.style.pointerEvents = "none";
    state.cur.rangeScore = score; renderActions(); document.getElementById("actions").scrollIntoView({ behavior: "smooth", block: "center" });
  };
  sheet.appendChild(done); main.appendChild(sheet);
}

function answer(i){
  const { f, s, d } = state.cur; if (state.cur.done) return; state.cur.done = true;

  const want = new URLSearchParams(location.search).get("pack") || "pack-v1.foldpack";
  if (want){ main.innerHTML = `<div class="empty">Loading ${want}…</div>`; try { PACK = await loadFoldpack(want); } catch(e){ main.innerHTML = `<div class="empty">Could not load ${want}: ${e.message}</div>`; return; } }
  if (!PACK || !PACK.flops.length){ main.innerHTML = `<div class="empty">No pack found. Run <code>fold-cli solve</code> then <code>fold-cli pack</code>.</div>`; return; }
  start();
})();
/* ---------- range puzzle: name villain's exact combos when the range is narrow ---------- */
function puzzlePool(){ const out = []; PACK.flops.forEach(f => f.spots.forEach(s => { if (s.vcombos && s.vcombos.filter(c => c[1] >= 0.3).length >= 6) out.push({ f, s }); })); return out; }
function comboCell(c){ return cellOf([c.slice(0, 2), c.slice(2, 4)]); }
function allCombos(cell, board){
  const r = Math.floor(cell / 13), c = cell % 13, S = "shdc", out = [], hi = R[Math.min(r, c)], lo = R[Math.max(r, c)];
  for (const a of S) for (const b of S){ if (r === c ? S.indexOf(a) >= S.indexOf(b) : (r < c) !== (a === b)) continue; const x = hi + a, y = lo + b; if (board.includes(x) || board.includes(y)) continue; out.push(x + y); }
  return out;
}
function nextPuzzle(){

  const { f, s } = pool[Math.floor(Math.random() * pool.length)], F = formInfo(f), tb = F.three_bet || f.three_bet || 0;
  const norm = c => { const a = c.slice(0, 2), b = c.slice(2, 4); return R.indexOf(a[0]) < R.indexOf(b[0]) || (a[0] === b[0] && "shdc".indexOf(a[1]) < "shdc".indexOf(b[1])) ? a + b : b + a; };

  const decoys = [...Array(169).keys()].filter(i => !truthCells.includes(i) && (!pre || pre[i] >= 0.3) && allCombos(i, s.board).length).sort((x, y) => dist(x) - dist(y) + (Math.random() - 0.5)).slice(0, Math.max(6, Math.round(truthCells.length * 0.8)));

  const allIn = new Set(s.vcombos.map(c => comboCell(c[0])));
  const must = BIG.filter(i => (!pre || pre[i] >= 0.3) && !truthCells.includes(i) && allCombos(i, s.board).length);
  const cells = [...new Set([...truthCells, ...decoys, ...traps, ...must])].sort((x, y) => x - y), sel = new Set(), open = new Set();
  const pill = (pos, txt, kind) => `<span class="pl ${kind}"><b>${pos}</b>${txt}</span>`, hk = h => /call/i.test(h.label) ? "call" : /bet|raise|all/i.test(h.label) ? "raise" : "chk";
  const rows = [[-1, tb ? [pill(F.caller, bbf(F.open_size), "raise"), pill(F.opener, "3-bet " + bbf(tb), "raise"), pill(F.caller, "call", "call")] : [pill(F.opener, bbf(F.open_size), "raise"), pill(F.caller, "call", "call")]]];
  (s._raw ? s._raw.history : s.history).forEach(h => { if (rows[rows.length-1][0] !== h.street) rows.push([h.street, []]); rows[rows.length-1][1].push(pill(h.pos, String(h.label).toLowerCase(), hk(h))); });

  main.innerHTML = "";
  main.appendChild($(`<div class="table"><div class="hist">${rows.map(([st, ps]) => `<div class="hrow past"><span class="st">${st < 0 ? "Pre" : STREETS[st]}</span><div class="pls">${ps.join("")}</div></div>`).join("")}</div><div class="board">${s.board.map(c => cardEl(c)).join("")}</div></div>`));
  const sheet = $(`<div class="sheet pz"><p class="prompt"><b>${s.villain}</b> gets here with about <b>${need}</b> combos. Find them. Tap a hand to add all its combos, tap a combo to drop it.</p><div class="pzcount"><b id="pzn">0</b> / ${need} picked</div><div class="pzg" id="pzg"></div></div>`);
  const grid = sheet.querySelector("#pzg"), mini = c => `<span class="mc ${c[1]}">${c[0] === "T" ? "10" : c[0]}${SUITCH[c[1]]}</span>`;
  const draw = () => { sheet.querySelector("#pzn").textContent = sel.size; [...grid.children].forEach(el => { const i = +el.dataset.i, cs = allCombos(i, s.board), n = cs.filter(c => sel.has(c)).length;
      el.classList.toggle("on", n > 0); el.classList.toggle("part", n > 0 && n < cs.length); el.classList.toggle("open", open.has(i)); el.querySelector(".n").textContent = n ? `${n}/${cs.length}` : cs.length;
      [...el.querySelectorAll(".cb")].forEach(b => b.classList.toggle("on", sel.has(b.dataset.c))); }); };
  cells.forEach((i, k) => { const cs = allCombos(i, s.board);
    const el = $(`<div class="pzc" data-i="${i}" style="animation-delay:${k * 18}ms"><div class="hd"><b>${cellName(i)}</b><span class="n"></span></div><div class="cbs">${cs.map(c => `<div class="cb" data-c="${c}">${mini(c.slice(0, 2))}${mini(c.slice(2, 4))}</div>`).join("")}</div></div>`);

    [...el.querySelectorAll(".cb")].forEach(b => b.onclick = e => { e.stopPropagation(); if (state.pzDone) return; sel.has(b.dataset.c) ? sel.delete(b.dataset.c) : sel.add(b.dataset.c); draw(); });
    grid.appendChild(el); });

  const done = $(`<button class="next" style="position:static;margin-top:10px">Lock in</button>`);
  done.onclick = () => {
    state.pzDone = true; let hit = 0, miss = 0, extra = 0, k = 0;
    [...grid.children].forEach(el => { [...el.querySelectorAll(".cb")].forEach(b => { const w = W[b.dataset.c] || 0, on = sel.has(b.dataset.c), tin = w >= 0.3, grey = w >= 0.05 && w < 0.3;
      const cls = tin && on ? "ok" : tin ? "miss" : grey ? "" : on ? "extra" : ""; if (cls === "ok" && tin) hit++; if (cls === "miss") miss++; if (cls === "extra") extra++;
      b.style.transitionDelay = (k++ * 6) + "ms"; if (cls) b.classList.add(cls); if (w >= 0.05) b.title = Math.round(100 * w) + "%"; }); el.classList.toggle("open", !!el.querySelector(".cb.ok,.cb.miss,.cb.extra")); el.classList.toggle("dead", ![...el.querySelectorAll(".cb")].some(b => b.classList.contains("ok") || b.classList.contains("miss") || b.classList.contains("extra"))); });
    const score = 2*hit / (2*hit + miss + extra || 1), st = store.get("puzzle", { n: 0, sum: 0 }); st.n++; st.sum += score; store.set("puzzle", st);
    sheet.querySelector(".prompt").innerHTML = `<b>${pct(score)}</b> · found ${hit} of ${need}${miss ? `, <span style="color:var(--bad)">missed ${miss}</span>` : ""}${extra ? `, <span style="color:var(--warn)">${extra} not there</span>` : ""}. ${suitNote(s)} <span style="color:var(--dim)">Average ${pct(st.sum / st.n)} over ${st.n}.</span>`;
    { const gone = must.filter(i => !allIn.has(i)); if (gone.length) sheet.querySelector(".prompt").innerHTML += ` <span style="color:var(--dim)">${gone.map(cellName).join(", ")} started in ${s.villain}'s range but ${gone.length > 1 ? "take" : "takes"} a different line (almost never plays it this way).</span>`; }
    if (traps.length){ const vIsOpener = s.villain === F.opener, why = tb ? (vIsOpener ? `does not 3-bet these over ${F.caller}'s open` : `opened, ${F.opener} 3-bet, and with these ${s.villain} 4-bets rather than just calling the 3-bet`) : (vIsOpener ? "does not open these" : `would have 3-bet ${F.opener}'s open instead of calling`);
      sheet.querySelector(".prompt").innerHTML += ` <span style="color:var(--dim)">No ${traps.map(cellName).join(", ")}: ${s.villain} ${why}.</span>`;
      traps.forEach(i => { const el = grid.querySelector(`[data-i="${i}"]`); if (el) el.querySelector(".n").textContent = "not preflop"; }); }
    done.textContent = "Next puzzle →"; done.onclick = nextPuzzle; window.scrollTo({ top: 0, behavior: "smooth" });
  };
  // copy a compact text description of this puzzle (for asking about it elsewhere)
  const cp = $(`<button class="next ghost" style="position:static;margin-top:8px;font-size:12px;padding:9px">Copy puzzle</button>`);
  cp.onclick = async () => {
    const H = (s._raw ? s._raw.history : s.history).map(h => `${STREETS[h.street][0]}:${h.pos} ${h.label}`).join(", ");
    const byCell = list => { const m = {}; list.forEach(([c, w]) => { const k = cellName(comboCell(c)); (m[k] = m[k] || []).push(w == null ? c : `${c}${w < 1 ? ":" + Math.round(100 * w) : ""}`); }); return Object.entries(m).map(([k, v]) => `${k}[${v.join(" ")}]`).join(" "); };
    const txt = [`FOLD puzzle ${f.formation} | flop ${f.flop} | spot ${s.id} | pack ${PACK.tree || ""} ${PACK.ranges || ""}`.trim(),
      `board ${s.board.join(" ")} | villain ${s.villain} | hero ${s.hero} | pot ${s.pot} | to_call ${s.to_call}`, `line: ${tb ? "3-bet pot; " : ""}${H || "(first to act)"}`,
      `offered: ${cells.map(cellName).join(" ")}`, `picked (${sel.size}): ${byCell([...sel].map(c => [c, null])) || "-"}`,
      `truth (weight % of fullest, none = 100): ${byCell(s.vcombos)}`, state.pzDone ? `result: ${sheet.querySelector(".prompt").innerText}` : "not locked in yet"].join("\n");

  };
