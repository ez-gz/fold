<body>
<div id="app">
  <header>
    <div class="logo">FOLD</div>
    <div class="chips" id="filters"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div id="main"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
"use strict";
const R = "AKQJT98765432", SUIT = {s:"♠",h:"♥",d:"♦",c:"♣"}, STREETS = ["Flop","Turn","River"];
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const pct = (x, d = 0) => (100 * x).toFixed(d) + "%";
const store = { get(k, d){ try { const v = localStorage.getItem("fold."+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem("fold."+k, JSON.stringify(v)); } catch(e){} } };

let PACK = window.FOLD_PACK;
const SEATS = ["UTG","HJ","CO","BTN","SB","BB"], sleep = ms => new Promise(r => setTimeout(r, ms));
const state = { mode: store.get("mode", "hands"), hand: null, hn: 0, hsum: 0, street: store.get("street", -1), rangeCheck: store.get("rangeCheck", false), focus: null, queue: [], cur: null, n: 0, loss: 0, best: 0, streak: 0 };

function cellName(i){ const r = Math.floor(i/13), c = i%13; return r === c ? R[r]+R[c] : r < c ? R[r]+R[c]+"s" : R[c]+R[r]+"o"; }
function cellOf(hand){ // hand = ["Ah","Kd"]
  const a = R.indexOf(hand[0][0]), b = R.indexOf(hand[1][0]), hi = Math.min(a,b), lo = Math.max(a,b);
  return hi === lo || hand[0][1] === hand[1][1] ? hi*13+lo : lo*13+hi;
}
function cardEl(c, cls = ""){ return `<div class="card ${c[1]} ${cls}">${c[0] === "T" ? "10" : c[0]}<small>${SUIT[c[1]]}</small></div>`; }
function kindClass(spot, i){ const a = spot.actions[i]; if (a.kind === "bet" || a.kind === "raise"){ const bets = spot.actions.filter(x => x.kind === a.kind); return `k-${a.kind}${bets.length > 1 ? bets.indexOf(a) : 0}`; } return "k-" + a.kind; }
function kindColor(kind, idx = 0){ return kind === "fold" ? "var(--fold)" : kind === "check" || kind === "call" ? "var(--call)" : idx ? "var(--bet2)" : "var(--bet1)"; }

/* ---------- labels: big blinds first, pot % in parens ---------- */
const bbf = x => (Math.round(x * 10) / 10).toString() + "bb";
function relabelHistory(f, hist){
  let pot = f.start_pot, owe = 0, commit = {}, st = 0;
  return hist.map(h => {

/* ---------- queue ---------- */
function buildQueue(){
  const q = [];

  for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [q[i], q[j]] = [q[j], q[i]]; }

function next(){ if (!state.queue.length) buildQueue(); state.cur = state.queue.pop(); state.cur ? renderSpot() : (main.innerHTML = `<div class="empty">No spots for this filter.</div>`); window.scrollTo(0,0); }

/* ---------- grading ---------- */
/* ---------- concepts: name the situation so results can be tracked and drilled by it ---------- */
function concept(f, s){

    if (s.street === 2) return "Facing a river bet";

  keys.forEach(k => { const e = book[k] || (book[k] = { n: 0, p: 0, bb: 0, ok: 0 }); e.n++; e.p += Math.min(gr.p, 25); e.bb += gr.loss; if (gr.g === "Best" || gr.g === "Good") e.ok++; });

/* direction of the error, so Leaks can say why and not only where */

  if (me === "fold") return agg(best) ? "fold when raising is best" : "fold too much";
  if (best === "fold") return agg(me) ? "raise when folding is best" : "call too much";
  if (agg(me) && agg(best)) return i > gr.bestIdx ? "size too big" : "size too small";
  if (agg(me)) return s.to_call > 0 ? "raise when calling is best" : "bet when checking is best";
  return s.to_call > 0 ? "call when raising is best" : "check when betting is best";

/* finer hand type than the pack's 7 classes, from the exact cards: kicker, pair rank, nut vs low flush draw, open-ender vs gutshot */

  const w = errKind(s, d, i, gr); if (w){ const x = e.err[w] || (e.err[w] = { n: 0, p: 0 }); x.n++; x.p += Math.min(gr.p, 25); }

/* ---------- rationale (templated from solver facts) ---------- */
function topClasses(f, shares, n = 2, min = 0.03){
  const tot = shares.reduce((a,b) => a+b, 0) || 1;
  return shares.map((v,i) => [v/tot, i]).filter(x => x[0] >= min).sort((a,b) => b[0]-a[0]).slice(0,n).map(x => `${f.class_names[x[1]].toLowerCase()} (${pct(x[0])})`).join(", ");
}
function groupSummary(sh){ const t = sh.reduce((a,b)=>a+b,0)||1; return { strong:(sh[0]+sh[1])/t, mid:sh[2]/t, draws:(sh[3]+sh[4])/t, air:(sh[5]+sh[6])/t }; }
function exampleCells(spot, grid, n = 4){ // chart cells carrying the most of villain's range into this response
  const combos = i => (i%14 === 0 ? 6 : Math.floor(i/13) < i%13 ? 4 : 12);
  return grid.map((v, i) => [v * spot.vr[i] * combos(i), i]).filter(x => x[0] > 0.3).sort((a, b) => b[0] - a[0]).slice(0, n).map(x => cellName(x[1])).join(", ");
}
function respInfo(f, spot, d, a){

  const fi = r.kinds.indexOf("fold"), fold = fi >= 0 ? r.freq[fi] : 0;
  const cont = Array(7).fill(0); let raise = 0;
  r.kinds.forEach((k, x) => { if (k !== "fold") r.cls[x].forEach((v, c) => cont[c] += v); if (k === "raise" || k === "bet") raise += r.freq[x]; });
  const contGrid = Array(169).fill(0); r.kinds.forEach((k, x) => { if (k !== "fold") r.grid[x].forEach((v, c) => contGrid[c] += v); });

}
function explain(f, spot, d, chosen, gr){

  if (gr.g !== "Best" && gr.g !== "Good") out.push(`<b>${A[chosen].label}</b> gives up ${gr.loss.toFixed(2)}bb vs <b>${A[best].label}</b>.`);
  else if (d.strat.filter(v => v > 0.15).length > 1) out.push(`Mixed spot — the solver's options are near-equal in EV.`);
  out.push(`<span class="k">${V}:</span> ${pct(g.strong)} top pair+, ${pct(g.mid)} weak pairs, ${pct(g.draws)} draws, ${pct(g.air)} air. <span class="k">You:</span> ${f.class_names[d.cls].toLowerCase()}, <b>${pct(d.eq)}</b> equity${rank}.`);

    out.push(`<span class="k">The price:</span> calling ${bbf(spot.to_call)} into ${bbf(spot.pot)} needs <b>${pct(need)}</b> equity. You have ${pct(d.eq)} against the range that bets here${d.eq < need ? " — not enough on its own" : d.eq < need + 0.08 ? " — close, so how well the hand plays later streets decides it" : " — comfortably enough"}.`);

/* ---------- grids ---------- */
function gridEl(paint){ const g = $(`<div class="grid"></div>`); for (let i = 0; i < 169; i++) g.appendChild($(`<div class="cell" data-i="${i}"><i></i><span>${cellName(i)}</span></div>`)); if (paint) paint(g); return g; }
function paintSplit(g, weight, parts, me){ // parts: [{color, grid}]

    <div class="pzcount"><b id="pzn">0</b> / ${need} picked</div><div class="chips" id="pzp" style="margin-bottom:9px"></div><div id="pzgrid"></div><div id="pzfocus"></div>
    <div class="pztray" id="pztray"></div></div>`);
  const g = gridEl(); sheet.querySelector("#pzgrid").appendChild(g);
  const mini = c => `<span class="mc ${c[1]}">${c[0] === "T" ? "10" : c[0]}${SUITCH[c[1]]}</span>`, pair = (c, cls = "") => `<div class="cb ${cls}" data-c="${c}">${mini(c.slice(0, 2))}${mini(c.slice(2, 4))}</div>`;
  // the board's flush suit, if any: lets a whole selection be cut down to the combos that hold it
  const sc = {}; s.board.forEach(c => sc[c[1]] = (sc[c[1]] || 0) + 1); const fs = Object.keys(sc).sort((x, y) => sc[y] - sc[x])[0], hasFs = sc[fs] >= 2;
  const holds = c => c[1] === c[3] ? c[1] === fs : (c[1] === fs || c[3] === fs);
  const markOf = c => { const w = W[c] || 0, on = sel.has(c); return w >= 0.3 ? (on ? "ok" : "miss") : w >= 0.05 ? "" : on ? "extra" : ""; };
  const draw = () => {
    sheet.querySelector("#pzn").textContent = sel.size;
    [...g.children].forEach((el, i) => { const cs = CO[i], n = cs.filter(c => sel.has(c)).length, fr = cs.length ? n / cs.length : 0;
      let cls = "cell" + (inPre(i) && cs.length ? " in" : "") + (n ? " sel" : "") + (i === focus ? " foc" : "");
      if (done){ const m = cs.map(markOf); cls += m.includes("miss") ? " miss" : m.includes("extra") ? " extra" : ""; }
      el.className = cls; el.firstChild.style.cssText = n ? `background:var(--accent);opacity:.55;top:${100 - 100 * fr}%` : ""; });
    const fo = sheet.querySelector("#pzfocus");
    if (focus < 0 || !CO[focus].length) fo.innerHTML = "";
    else { fo.innerHTML = `<div class="pzf"><div class="hd"><b>${cellName(focus)}</b><span>${done ? "weight = how often this combo gets here" : "tap a combo to drop or add it"}</span>${done ? "" : `<em data-a="all">all</em>${hasFs ? `<em data-a="fs">${SUITCH[fs]} only</em>` : ""}<em data-a="none">none</em>`}</div><div class="cbs">${CO[focus].map(c => pair(c, (sel.has(c) ? "on " : "") + (done ? markOf(c) : ""))).join("")}</div></div>`;
      if (done) [...fo.querySelectorAll(".cb")].forEach(b => { const w = W[b.dataset.c] || 0; if (w >= 0.05) b.insertAdjacentHTML("beforeend", `<small>${Math.round(100 * w)}%</small>`); });
      [...fo.querySelectorAll(".cb")].forEach(b => b.onclick = () => { if (done) return; sel.has(b.dataset.c) ? sel.delete(b.dataset.c) : sel.add(b.dataset.c); draw(); });
      [...fo.querySelectorAll("em")].forEach(e => e.onclick = () => { CO[focus].forEach(c => (e.dataset.a === "all" || (e.dataset.a === "fs" && holds(c))) ? sel.add(c) : sel.delete(c)); draw(); }); }
    // the table: every exact holding laid out, overlapping, grouped by hand
    const tray = sheet.querySelector("#pztray"), list = done ? [...new Set([...sel, ...Object.keys(W).filter(c => W[c] >= 0.3)])] : [...sel];
    const by = {}; list.forEach(c => (by[comboCell(c)] = by[comboCell(c)] || []).push(c));
    tray.innerHTML = list.length ? Object.keys(by).map(Number).sort((x, y) => x - y).map(i => `<div class="grp" data-i="${i}"><label>${cellName(i)}</label><div class="fan">${by[i].map(c => pair(c, "on " + (done ? markOf(c) : ""))).join("")}</div></div>`).join("") : `<span class="hint">Picked hands show up here as cards.</span>`;
    [...tray.querySelectorAll(".grp")].forEach(el => el.onclick = () => { focus = +el.dataset.i; draw(); });
  };
  g.onclick = e => { const el = e.target.closest(".cell"); if (!el) return; const i = [...g.children].indexOf(el), cs = CO[i]; if (!cs.length) return;
    if (!done){ const any = cs.some(c => sel.has(c)); if (any && focus === i){ cs.forEach(c => sel.delete(c)); focus = -1; draw(); return; } if (!any) cs.forEach(c => sel.add(c)); }
    focus = i; draw(); };
  // one-tap groups; they only touch hands villain can have preflop
  const rc = i => [Math.floor(i/13), i%13], br = [...new Set(s.board.map(c => R.indexOf(c[0])))].sort((x, y) => x - y), top = br[0];
  const presets = {
    "Sets": i => { const [r, c] = rc(i); return r === c && br.includes(r); }, "Two pair": i => { const [r, c] = rc(i); return r !== c && br.includes(r) && br.includes(c); },
    [`${R[top]}x top pair`]: i => { const [r, c] = rc(i); return r !== c && (r === top || c === top); }, "Overpairs": i => { const [r, c] = rc(i); return r === c && r < top; },
    "Pairs": i => { const [r, c] = rc(i); return r === c; }, "Broadway": i => { const [r, c] = rc(i); return r !== c && r <= 4 && c <= 4; },
    "Suited aces": i => { const [r, c] = rc(i); return r === 0 && c > 0; }, "Suited connectors": i => { const [r, c] = rc(i); return r < c && c - r === 1; },
    "Suited gappers": i => { const [r, c] = rc(i); return r < c && (c - r === 2 || c - r === 3); }, "Offsuit": i => { const [r, c] = rc(i); return r > c; },
  };
  const pz = sheet.querySelector("#pzp");
  Object.entries(presets).forEach(([name, fn]) => { const cells = [...Array(169).keys()].filter(i => fn(i) && inPre(i) && CO[i].length); if (!cells.length) return;
    const chip = $(`<div class="chip">${name}</div>`); chip.onclick = () => { if (done) return; const all = cells.every(i => CO[i].every(c => sel.has(c))); cells.forEach(i => CO[i].forEach(c => all ? sel.delete(c) : sel.add(c))); focus = -1; draw(); }; pz.appendChild(chip); });
  if (hasFs){ const chip = $(`<div class="chip" style="border-color:var(--accent)">Keep ${SUITCH[fs]} only</div>`); chip.onclick = () => { if (done) return; [...sel].forEach(c => { if (!holds(c)) sel.delete(c); }); draw(); }; pz.appendChild(chip); }
  { const chip = $(`<div class="chip">Clear</div>`); chip.onclick = () => { if (done) return; sel.clear(); focus = -1; draw(); }; pz.appendChild(chip); }
  draw();
  const lock = $(`<button class="next" style="position:static;margin-top:10px">Lock in</button>`);
  lock.onclick = () => {
    done = true; state.pzDone = true; let hit = 0, miss = 0, extra = 0;
    new Set([...sel, ...Object.keys(W)]).forEach(c => { const m = markOf(c); if (m === "ok") hit++; else if (m === "miss") miss++; else if (m === "extra") extra++; });
    const score = 2*hit / (2*hit + miss + extra || 1), st = store.get("puzzle", { n: 0, sum: 0 }); st.n++; st.sum += score; store.set("puzzle", st); state.shareScore = Math.round(100 * score) + "%"; renderStats();
    const P = sheet.querySelector(".prompt");
    P.innerHTML = `<b>${pct(score)}</b> · found ${hit} of ${need}${miss ? `, <span style="color:var(--bad)">missed ${miss}</span>` : ""}${extra ? `, <span style="color:var(--warn)">${extra} not there</span>` : ""}. ${suitNote(s)} <span style="color:var(--dim)">Average ${pct(st.sum / st.n)} over ${st.n}. Tap any square for its exact combos.</span>`;
    const BIG = [0, 14, 28, 42, 56, 70, 84, 1, 13], allIn = new Set(s.vcombos.map(c => comboCell(c[0])));
    const gone = BIG.filter(i => inPre(i) && CO[i].length && !allIn.has(i)), never = pre ? BIG.filter(i => !inPre(i) && CO[i].length) : [];
    if (gone.length) P.innerHTML += ` <span style="color:var(--dim)">${gone.map(cellName).join(", ")} started in ${s.villain}'s range but ${gone.length > 1 ? "take" : "takes"} a different line.</span>`;
    if (never.length){ const vOp = s.villain === F.opener, why = tb ? (vOp ? `does not 3-bet these over ${F.caller}'s open` : `opened, ${F.opener} 3-bet, and with these ${s.villain} 4-bets rather than just calling`) : (vOp ? "does not open these" : `would have 3-bet ${F.opener}'s open instead of calling`);
      P.innerHTML += ` <span style="color:var(--dim)">No ${never.map(cellName).join(", ")}: ${s.villain} ${why}.</span>`; }
    sheet.querySelector("#pzgrid").insertAdjacentHTML("beforebegin", puzzleWhy(s, W, inPre, CO));
    pz.remove(); focus = -1; draw(); lock.textContent = "Next puzzle →"; lock.onclick = nextPuzzle; window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const cp = $(`<button class="next ghost" style="position:static;margin-top:8px;font-size:12px;padding:9px">Copy puzzle</button>`);
  cp.onclick = async () => {
    const H = (s._raw ? s._raw.history : s.history).map(h => `${STREETS[h.street][0]}:${h.pos} ${h.label}`).join(", ");
    const byCell = list => { const m = {}; list.forEach(([c, w]) => { const k = cellName(comboCell(c)); (m[k] = m[k] || []).push(w == null ? c : `${c}${w < 1 ? ":" + Math.round(100 * w) : ""}`); }); return Object.entries(m).map(([k, v]) => `${k}[${v.join(" ")}]`).join(" "); };
    const txt = [`FOLD puzzle ${f.formation} | flop ${f.flop} | spot ${s.id} | pack ${PACK.tree || ""} ${PACK.ranges || ""}`.trim(),
      `board ${s.board.join(" ")} | villain ${s.villain} | hero ${s.hero} | pot ${s.pot} | to_call ${s.to_call}`, `line: ${tb ? "3-bet pot; " : ""}${H || "(first to act)"}`,
      `picked (${sel.size}): ${byCell([...sel].map(c => [c, null])) || "-"}`, `truth (weight % of fullest, none = 100): ${byCell(s.vcombos)}`, done ? `result: ${sheet.querySelector(".prompt").innerText}` : "not locked in yet"].join("\n");
    try { await navigator.clipboard.writeText(txt); } catch (e) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    cp.textContent = "Copied ✓"; setTimeout(() => cp.textContent = "Copy puzzle", 1400);
  };
  const prow = $(`<div class="sharerow" style="position:static"></div>`); lock.style.marginTop = "0"; prow.appendChild(shareBtn()); prow.appendChild(lock); sheet.appendChild(prow); sheet.appendChild(cp); main.appendChild(sheet); challengeNote(); window.scrollTo(0, 0);
}
function start(){ state.hand = null; renderFilters(); renderStats(); state.mode === "puzzle" ? nextPuzzle() : state.mode === "hands" ? nextHand() : next(); }
</script>
